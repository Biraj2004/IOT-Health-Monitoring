name: Dashboard Verify

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: dashboard-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & Build Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Static code analysis (oxlint)
        working-directory: dashboard
        run: npm run lint

      - name: Compile production bundle (vite build)
        working-directory: dashboard
        run: npm run build
